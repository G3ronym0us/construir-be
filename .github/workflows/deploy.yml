name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - restart

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.action == 'deploy'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd ~/construir-be

            echo "📥 Pulling latest changes..."
            git pull origin main

            # NO se tumba el servicio antes de construir. El orden anterior
            # hacía `down` primero, así que un build fallido dejaba la tienda
            # caída — y el build falla por cosas ajenas al código, como el disco
            # lleno. Se construye con el servicio en pie y se cambia al final,
            # que además baja el corte a unos segundos.
            echo "🧹 Cleaning up dangling images..."
            docker image prune -f

            echo "🧹 Liberando espacio antes de construir..."
            # El build de Docker muere con ENOSPC y deja el servicio caído.
            # Ya pasó: el disco llegó al 95% con cinco proyectos en la misma
            # máquina. Se limpia ANTES, no después de romper nada.
            docker builder prune -f || true
            df -h / | tail -1

            echo "🔨 Building new image..."
            docker compose build app

            echo "🗄️ Running database migrations..."
            docker compose run --rm app node -e "
              const { AppDataSource } = require('./dist/src/database/data-source');
              AppDataSource.initialize()
                .then(ds => ds.runMigrations())
                .then(migrations => {
                  console.log('Migrations run:', migrations.length ? migrations.map(m => m.name).join(', ') : 'none pending');
                  process.exit(0);
                })
                .catch(e => { console.error('Migration failed:', e); process.exit(1); });
            "

            echo "🚀 Cambiando al contenedor nuevo..."
            # `up -d` recrea sólo lo que cambió. Con `--no-deps` no se toca la
            # base de datos, que antes se reiniciaba en cada despliegue sin
            # necesidad.
            docker compose up -d --no-deps app

            echo "⏳ Waiting for application to start..."
            sleep 5

            echo "✅ Deployment completed!"
            docker logs --tail=20 construir-be

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment successful!"
          else
            echo "❌ Deployment failed!"
          fi

  restart:
    name: Restart Container
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'restart'

    steps:
      - name: Restart container
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd ~/construir-be

            echo "🔄 Recreando el contenedor..."
            # `restart` NO relee el .env: el entorno se fija al CREAR el
            # contenedor, así que una variable nueva no entra y el fallo es
            # mudo — el servicio arranca bien, con la configuración vieja.
            docker compose up -d --force-recreate --no-deps app

            echo "⏳ Waiting for application to start..."
            sleep 5

            echo "✅ Restart completed!"
            docker logs --tail=20 construir-be
