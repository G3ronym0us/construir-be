name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - restart

# Dos despliegues a la vez se pisan: el segundo construye mientras el primero
# está cambiando el contenedor, y el que gana la carrera es el azar. Se hacen
# en fila. `cancel-in-progress: false` a propósito: cancelar uno a medias
# puede dejar migraciones aplicadas sin su código.
concurrency:
  group: despliegue-produccion
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.action == 'deploy'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          # NO se usa `script_stop: true`. Parece la opción obvia para que el
          # script pare en el primer fallo, y rompe el despliegue: la acción no
          # la aplica como bandera pasiva, sino PARTIENDO EL SCRIPT POR LÍNEAS
          # e inyectando entre cada una un guardián de shell
          # (`DRONE_SSH_PREV_COMMAND_EXIT_CODE=0 ; if [ 0 -ne 0 ]; ...`). Con
          # un comando de varias líneas —el `node -e` de las migraciones— el
          # guardián aterriza DENTRO del argumento entrecomillado y node muere
          # con `SyntaxError: Unexpected token '['`. Pasó el 11-09-2026.
          #
          # Quien pare el script es `set -euo pipefail`, que hace el mismo
          # trabajo sin trocear nada: la acción manda todo el script a UN solo
          # shell, así que el `set -e` gobierna de principio a fin.
          script: |
            set -euo pipefail

            cd ~/construir-be

            echo "📥 Trayendo los cambios..."
            # `--ff-only`: si el repo del servidor tiene cambios locales o
            # divergió, esto FALLA en vez de fusionar solo o quedarse callado
            # desplegando el código viejo. Un servidor con parches a mano es un
            # problema que hay que ver, no que resolver a ciegas.
            git pull --ff-only origin main

            echo "🧹 Liberando espacio antes de construir..."
            # El build de Docker muere con ENOSPC y deja el servicio caído.
            # Ya pasó: el disco llegó al 95% con cinco proyectos en la misma
            # máquina. Se limpia ANTES, no después de romper nada.
            #
            # `|| true` en las limpiezas: que no haya nada que borrar no es un
            # fallo, y con `set -e` tumbaría el despliegue sin motivo.
            docker image prune -f || true
            docker builder prune -f || true
            df -h / | tail -1

            # NO se tumba el servicio antes de construir. El orden anterior
            # hacía `down` primero, así que un build fallido dejaba la tienda
            # caída — y el build falla por cosas ajenas al código, como el
            # disco lleno. Se construye con el servicio en pie y se cambia al
            # final, que además baja el corte a unos segundos.
            echo "🔨 Construyendo la imagen nueva..."
            docker compose build app

            echo "🗄️ Corriendo migraciones..."
            # En UNA línea a propósito. Repartido en varias, cualquier capa que
            # procese el script línea a línea se mete dentro de las comillas y
            # lo que revienta no es el despliegue sino node, con un error de
            # sintaxis que no se parece en nada a la causa.
            docker compose run --rm app node -e "const { AppDataSource } = require('./dist/src/database/data-source'); AppDataSource.initialize().then(ds => ds.runMigrations()).then(ms => { console.log('Migraciones aplicadas:', ms.length ? ms.map(m => m.name).join(', ') : 'ninguna pendiente'); process.exit(0); }).catch(e => { console.error('Fallo la migracion:', e); process.exit(1); });"

            echo "🚀 Cambiando al contenedor nuevo..."
            # `up -d` recrea sólo lo que cambió. Con `--no-deps` no se toca la
            # base de datos, que antes se reiniciaba en cada despliegue sin
            # necesidad.
            docker compose up -d --no-deps app

            echo "🩺 Esperando a que la aplicación responda..."
            # Antes acá había un `sleep 5` y un volcado de log, y el despliegue
            # se daba por bueno sin preguntarle nada a la aplicación. Eso
            # importa más desde que `bootstrap()` se NIEGA A ARRANCAR ante
            # configuraciones peligrosas (ver `main.ts`): el modo de fallo
            # normal pasó a ser "el contenedor no levanta", que es justo el que
            # el `sleep` no veía. El servicio escucha en el 3001 del anfitrión.
            listo=""
            for intento in $(seq 1 30); do
              if curl -fsS -o /dev/null --max-time 5 http://localhost:3001/; then
                listo="si"
                echo "✅ Responde al intento $intento."
                break
              fi
              sleep 2
            done

            if [ -z "$listo" ]; then
              echo "❌ La aplicación no respondió en 60 segundos."
              echo "--- Últimas 80 líneas del log ---"
              docker logs --tail=80 construir-be || true
              echo "--- Estado del contenedor ---"
              docker ps -a --filter name=construir-be --format '{{.Names}} {{.Status}}'
              # OJO: las migraciones YA SE APLICARON. Volver a la imagen
              # anterior restauraría el servicio pero la base quedaría por
              # delante del código, así que no se hace solo: se falla ruidoso y
              # decide una persona.
              exit 1
            fi

            echo "✅ Despliegue completado."
            docker logs --tail=20 construir-be

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment successful!"
          else
            echo "❌ Deployment failed!"
            exit 1
          fi

  restart:
    name: Restart Container
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'restart'

    steps:
      - name: Restart container
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -euo pipefail

            cd ~/construir-be

            echo "🔄 Recreando el contenedor..."
            # `restart` NO relee el .env: el entorno se fija al CREAR el
            # contenedor, así que una variable nueva no entra y el fallo es
            # mudo — el servicio arranca bien, con la configuración vieja.
            docker compose up -d --force-recreate --no-deps app

            echo "🩺 Esperando a que la aplicación responda..."
            # Un reinicio es justo cuando se acaba de tocar el `.env`, y una
            # variable mal puesta hace que `bootstrap()` no levante. Sin esta
            # comprobación, el reinicio que tumba la tienda se reporta en verde.
            listo=""
            for intento in $(seq 1 30); do
              if curl -fsS -o /dev/null --max-time 5 http://localhost:3001/; then
                listo="si"
                echo "✅ Responde al intento $intento."
                break
              fi
              sleep 2
            done

            if [ -z "$listo" ]; then
              echo "❌ La aplicación no respondió en 60 segundos."
              docker logs --tail=80 construir-be || true
              exit 1
            fi

            echo "✅ Reinicio completado."
            docker logs --tail=20 construir-be
